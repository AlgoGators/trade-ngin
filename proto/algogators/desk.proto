// AlgoGators gRPC API
// API: desk
// Version: 1.6.0
// Compatibility: a client must send x-algogators-api-version: desk=<major>.<minor>.<patch>; the
// server refuses a different major and accepts any minor/patch (docs/design/rpc.md).
//
// desk.proto -- the QT desk commands from AlgoLens to the trade-ngin engine.
//
// Owned by the engine (trade-ngin). AlgoLens vendors this file byte-for-byte at a pinned commit
// and commits the stubs generated from it. See docs/design/rpc.md for the shared layer
// (versioning, ports, health) and docs/design/desk-service.md for this service.
//
// References in the comments below:
//   "plan 3b"   docs/design/qt-platform-analysis-and-plan.md, section 3b (decisions 2026-10-08)
//   "Dn"        docs/design/qt-platform-design.md, section 2 (decisions D1..D22)
//   "ruling N"  the QT platform master document (2026-10-08), numbered rulings
//
// Ground rules (plan 3b, "gRPC command channel"):
//   * Postgres stays the record: books, audit trail, settings and run metadata. gRPC carries
//     commands only; no reply here is the record of anything.
//   * Every mutating command is idempotent and keyed on its trading.position_overrides row
//     (audit_id). AlgoLens writes that row FIRST, then calls. A retried call with the same
//     audit_id must not do the work twice. On startup the engine re-drives every row still
//     pending, so a dropped call loses nothing (ruling 26: no job table; position_overrides is
//     both the log and the queue).
//   * The engine refuses rather than guesses (ruling 24): an RPC that cannot do what it was
//     asked returns REFUSED or FAILED with a message, never a fabricated success.

syntax = "proto3";

package algogators.desk;

import "google/protobuf/timestamp.proto";

// The health service is the standard grpc.health.v1.Health (grpc_health/v1/health.proto),
// registered by the shared server next to every service. Service name for a targeted check:
// "algogators.desk.DeskService"; "" checks the server as a whole.
//
// Version history (bump Version above; a major bump is a breaking change, see docs/design/rpc.md):
//   1.0.0  2026-10-09  first versioned release. Same messages and field numbers as the earlier
//                      unversioned algogators.qt.v1 package, so the wire format is unchanged.
//   1.1.0  2026-10-09  the daily cutoff (qt-contract.md C7): RunStatus gains publish_source (8)
//                      and sent_at (9). Publish is the desk's approval ("Approve"): before 09:30
//                      New York it freezes the day and sends nothing, 09:30-10:00 it also sends,
//                      after 10:00 (or on a published day) it is refused. No field changed.
//   1.2.0  2026-10-13  Rescind (contract C8): the desk takes back its own approval before the
//                      09:30 send. New RPC and message only; no field changed.
//   1.3.0  2026-10-14  GetDeskRisk (contract C9): the risk report of the day's qt book and
//                      whether the desk's positions breach a risk limit. New RPC and messages
//                      only; no field changed.
//   1.4.0  2026-10-14  DeskRisk.checks (17), RiskCheck, RiskCheckStatus: every risk limit with
//                      the stored book's reading and its max, breach or not. Additive only.
//   1.5.0  2026-10-15  DeskRisk.multipliers (18), RiskMultiplier: the overlay's m, the risk
//                      scale and the configured IDM and FDM per strategy. Additive only.
//                      Contract C10 (the A -> B -> C approval) uses PublishRequest unchanged:
//                      the flow is the publish row's payload.
//   1.6.0  2026-10-16  DeskRisk.blocks_publish (19) and blockers (20): decision 5's publish
//                      gate (only the final book over a cap blocks; an approved override only
//                      over the margin cap), and DESK_RISK_STATE_INCOMPLETE (5): a qt book a
//                      desk or override run did not finish (it blocks). Additive only. Every
//                      publish path refuses on it.

service DeskService {
  // A desk save: run the desk loop on the whole qt_proposal and book the result as qt with
  // source=desk, per-symbol asked/given/step (plan 3b; plan E5/E6). Never sends mail
  // (ruling 15). Refused when no proposal has been seeded for the day (ruling 14).
  rpc RunDesk(RunDeskRequest) returns (RunDeskReply);

  // E-mails the VP and the President a signed, single-use approval link for a breaching
  // selection (D4, D5; plan A5/E7).
  rpc RequestOverride(OverrideRequest) returns (CommandReply);

  // A link click recorded by AlgoLens; on approval the engine books the override as qt with
  // source=override (D5, D17; plan 3b Q3).
  rpc RecordDecision(DecisionRequest) returns (CommandReply);

  // The desk's approval ("Approve" in AlgoLens; contract C7, amending ruling 18): freezes the
  // day's qt book and writes published_by/published_at and publish_source='desk' on
  // trading.live_run_metadata. Before 09:30 America/New_York it sends nothing (the 09:30 send
  // e-mails it); from 09:30 to 10:00 it also sends the e-mail and CSV built from the stored rows.
  // Refused after 10:00 on the book date (the row's created_at decides) and on a published day.
  // An earlier unpublished day refuses it (ruling 29).
  rpc Publish(PublishRequest) returns (CommandReply);

  // Since 1.2.0 (contract C8). Takes back the desk's approval ("Rescind approval" in AlgoLens):
  // clears published_by, published_at and publish_source on the day's trading.live_run_metadata
  // rows, so the day takes edits and a new approval again. Only a desk approval
  // (publish_source 'desk'), only before 09:30 America/New_York on the book date (the time the
  // engine runs it decides, not the row's created_at) and only while the day is unsent; refused
  // otherwise. The approval's publish row stays done as history (C4); the rescind row's result
  // records the approval it took back.
  rpc Rescind(RescindRequest) returns (CommandReply);

  // The model run's state for one book and day, read from trading.live_run_metadata, for the
  // desk pages (AlgoLens #97). Read-only; D18: no desk window opens unless the run succeeded.
  rpc GetRunStatus(RunStatusRequest) returns (RunStatus);

  // Since 1.3.0 (contract C9). The risk report of the day's qt book: what the engine's last run of
  // it (the model run, a desk save, an approved override) recorded in trading.live_results
  // risk_detail, the configured limits, and whether the desk's positions breach a risk limit (a
  // symbol moved by cap, overlay, clip or trim; the overlay cutting the book; the book still over
  // a limit). Trading rules (sign_close, rounding, buffer, search, hold) are reported, not
  // breaches. Read-only. AlgoLens refuses the desk's approval while within_limits is false and no
  // override was approved.
  rpc GetDeskRisk(DeskRiskRequest) returns (DeskRisk);
}

// Outcome of a command. Shared by RunDeskReply and CommandReply.
enum CommandStatus {
  COMMAND_STATUS_UNSPECIFIED = 0;
  // Taken and queued against its position_overrides row; the work completes asynchronously and
  // its result lands in Postgres (plan 3b: Postgres stays the record).
  COMMAND_STATUS_ACCEPTED = 1;
  // The work is done (or was already done for this audit_id: idempotent replay, plan 3b).
  COMMAND_STATUS_DONE = 2;
  // The engine declined on a rule, with the reason in `message` (ruling 24: refuse, never guess;
  // ruling 14: no seeded proposal). Not retryable as-is.
  COMMAND_STATUS_REFUSED = 3;
  // The engine tried and failed (crash, database error). Retryable with the same audit_id.
  COMMAND_STATUS_FAILED = 4;
}

// Which writer produced the day's qt book (plan 3b Q3).
enum BookSource {
  BOOK_SOURCE_UNSPECIFIED = 0;
  // The model run wrote qt as a copy of system (no save that day).
  BOOK_SOURCE_MODEL = 1;
  // A desk save overwrote qt with the desk loop's result.
  BOOK_SOURCE_DESK = 2;
  // An approved override booked qt_proposal exactly (D4, D5).
  BOOK_SOURCE_OVERRIDE = 3;
}

message RunDeskRequest {
  // trading.live_run_metadata.portfolio_id of the book, e.g. "CONSERVATIVE_PORTFOLIO". Futures
  // books only for now (ruling 13).
  string portfolio_id = 1;
  // Trading date of the book, "YYYY-MM-DD". Only day T is editable, never history (D3).
  string date = 2;
  // trading.position_overrides.id of the save event AlgoLens wrote before calling. The
  // idempotency key (plan 3b; ruling 26). Must be > 0.
  int64 audit_id = 3;
  // AlgoLens user who saved; carried for the audit trail (D10). The record of who is the
  // position_overrides row, not this field.
  string requested_by = 4;
}

// How the desk loop treated one symbol of the saved selection (plan E5: asked vs given).
message SymbolOutcome {
  string symbol = 1;
  // Quantity the desk asked for in qt_proposal. Quantities only, signed; 0 means flatten
  // (ruling 13, ruling 16).
  double asked = 2;
  // Quantity booked into qt.
  double given = 3;
  // The one-pass step that moved the symbol from asked to given (cap_bound, sign_closed,
  // clipped, trimmed, by_hold, ...); empty when given == asked (plan E5 one_pass::attribute).
  string moved_by = 4;
}

message RunDeskReply {
  CommandStatus status = 1;
  // Writer of the day's qt book after this command (plan 3b Q3).
  BookSource source = 2;
  // Human-readable reason for REFUSED/FAILED, or a summary for DONE. Never contains secrets.
  string message = 3;
  // Per-symbol outcome, one per symbol in the saved selection. Empty unless status is DONE.
  repeated SymbolOutcome outcomes = 4;
}

message OverrideRequest {
  string portfolio_id = 1;
  // "YYYY-MM-DD" (D3).
  string date = 2;
  // position_overrides.id of the override-request event (plan 3b; ruling 26).
  int64 audit_id = 3;
  // The requester. They can never approve their own request (D17).
  string requested_by = 4;
  // The written reason every desk change carries (D10). Required, non-empty.
  string reason = 5;
}

message DecisionRequest {
  // position_overrides.id of the override_decision row AlgoLens inserted for this click
  // (contract section 6); its parent_id names the override request. The row, not this message,
  // is the record: the engine checks the row's approver_role, requested_by and
  // payload.approved.
  int64 audit_id = 1;
  // The VP or President who clicked the link (D5, D17: roles in AlgoLens, never the requester,
  // no delegate).
  string approver = 2;
  // true = approve, false = reject. Either rejection ends the request (design section 6).
  bool approved = 3;
  // The single-use token from the e-mailed link (D5). AlgoLens checks sha256(token) against the
  // request row's token_hash before it inserts the decision row; the agent requires it to be
  // present and never logs it (a re-driven decision has no token, so the row is the record).
  string token = 4;
}

message PublishRequest {
  string portfolio_id = 1;
  // "YYYY-MM-DD" (D7). A missed earlier day is caught up first (ruling 29).
  string date = 2;
  // Written to live_run_metadata.published_by (plan A6/E8).
  string published_by = 3;
  // position_overrides.id of the 'publish' row AlgoLens wrote before calling (contract section
  // 6). 0 = the newest pending publish row for portfolio_id + date.
  int64 audit_id = 4;
}

message RescindRequest {
  string portfolio_id = 1;
  // "YYYY-MM-DD" (D7).
  string date = 2;
  // position_overrides.id of the 'rescind' row AlgoLens wrote before calling (contract section
  // 6). Required: there is no newest-pending lookup.
  int64 audit_id = 3;
}

message CommandReply {
  CommandStatus status = 1;
  // Reason for REFUSED/FAILED, or a summary. Never contains secrets.
  string message = 2;
}

message RunStatusRequest {
  string portfolio_id = 1;
  // "YYYY-MM-DD".
  string date = 2;
}

// State of the model run for one book and day (D16, D18).
enum RunState {
  RUN_STATE_UNSPECIFIED = 0;
  // No trading.live_run_metadata row for the book and date: the run has not started (or died
  // before writing its first row). D18: no desk window.
  RUN_STATE_NOT_STARTED = 1;
  // A metadata row exists but the run's last write (its trading.live_results row for the date)
  // has not landed yet. A run that crashed mid-way also reads as RUNNING; the watchdog
  // (scripts/check_live_trading.py) is what alerts on that.
  RUN_STATE_RUNNING = 2;
  // The metadata row carries no refusal mark and the live_results row for the date exists.
  RUN_STATE_SUCCEEDED = 3;
  // The row is marked `risk_refusal` (run_metadata_marks.hpp; T-RISK-ARCH Q2): the book was
  // held at the previous day's positions, not measured.
  RUN_STATE_REFUSED = 4;
  // The row is marked `strict_assertion`: the run stored no book (T-7b-1 C7b R4).
  RUN_STATE_FAILED = 5;
}

message RunStatus {
  RunState state = 1;
  // Earliest created_at of the day's live_run_metadata rows. Unset when absent.
  google.protobuf.Timestamp started_at = 2;
  // created_at of the day's live_results row (the run's last write). Unset when absent.
  google.protobuf.Timestamp finished_at = 3;
  // The refusal reason from the mark, or a short description of the state.
  string message = 4;
  // Publication fields (plan A6/E8). The live_run_metadata columns do not exist until the
  // publish migration lands; until then published is false and the others are unset/empty.
  bool published = 5;
  string published_by = 6;
  google.protobuf.Timestamp published_at = 7;
  // Since 1.1.0 (contract C7, migration 027). Who published the day: "desk" (the desk's
  // approval), "fallback" (not approved by 10:00 New York: the model's book was published, or a
  // missed past day was caught up), "model-only" (the untouched model twin). Empty: not
  // published, or published before migration 027.
  string publish_source = 8;
  // Since 1.1.0. When the day's e-mail went out. Unset: not sent (an approval before 09:30, a
  // past day caught up, or e-mail disabled).
  google.protobuf.Timestamp sent_at = 9;
}

message DeskRiskRequest {
  string portfolio_id = 1;
  // "YYYY-MM-DD".
  string date = 2;
}

// Which run wrote the day's qt book.
enum DeskRiskState {
  DESK_RISK_STATE_UNSPECIFIED = 0;
  // No qt row for the day yet: nothing to report.
  DESK_RISK_STATE_NO_BOOK = 1;
  // The model run's book (no desk save that day): inside the limits by construction.
  DESK_RISK_STATE_MODEL = 2;
  // A desk save: the pass ran on the desk's positions.
  DESK_RISK_STATE_DESK = 3;
  // An approved override: the ask trades as asked; the pass is a report.
  DESK_RISK_STATE_OVERRIDE = 4;
  // The qt row has no book_source: a desk or override run cleared it and did not finish (a
  // refused override, for one). The engine will not publish it; save again. Blocks publish.
  DESK_RISK_STATE_INCOMPLETE = 5;
}

message RiskBreach {
  // The overlay term (R, R_jump, R_shock, L_g, L_n, CAP), or the step that moved a symbol (cap,
  // overlay, clip, trim), or "refused".
  string term = 1;
  // A sentence for the desk.
  string detail = 2;
}

message SymbolRisk {
  string symbol = 1;
  double asked = 2;
  double given = 3;
  // The step that moved the symbol (one_pass::attribute), "none" when given == asked.
  string moved_by = 4;
  // "risk" (cap, overlay, clip, trim: a breach), "rule" (sign_close, rounding, buffer, search,
  // hold: reported only) or "none".
  string category = 5;
}

message RiskLimit {
  // A key of the portfolio's risk.json carver module: max_gross_leverage, max_net_leverage, R_max,
  // R_jump_max, R_shock_max, per_name_cap, trim_max.
  string name = 1;
  double value = 2;
}

message DeskRisk {
  DeskRiskState state = 1;
  // position_overrides.id of the desk save or override decision the report belongs to (0 on a
  // model or missing book).
  int64 audit_id = 2;
  // False when a risk limit bound on the desk's positions.
  bool within_limits = 3;
  // True on an approved override: breaches are reported but do not block.
  bool approved_override = 4;
  repeated RiskBreach breaches = 5;
  // The overlay's multiplier m (1.0: no cut) and the term that bound (or "none").
  double m = 6;
  string binding_term = 7;
  // ';'-separated overlay terms still over a limit, empty when none.
  string over_limit_after_rounding = 8;
  string over_limit_by_hold = 9;
  // The overlay could not size the book; the held book was kept.
  bool refused = 10;
  repeated SymbolRisk symbols = 11;
  // Readings of the stored qt book (trading.live_results); unset when not recorded.
  optional double gross_leverage = 12;
  optional double net_leverage = 13;
  optional double margin_cushion = 14;
  optional double equity_to_margin = 15;
  // The configured limits (risk.json), empty when the file is not found.
  repeated RiskLimit limits = 16;
  // Since 1.4.0: every risk check of the day's book, breach or not, in report order (R, R_jump,
  // R_shock, L_g, L_n, CAP, TRIM, then "refused" when the overlay refused). Labels, units and
  // maxes are trade-ngin's; a client renders them as given and hardcodes none.
  repeated RiskCheck checks = 17;
  // Since 1.5.0: the multipliers of the day's book, in report order: the overlay's m and the
  // risk scale the last run applied, then each live strategy's configured IDM and FDM.
  repeated RiskMultiplier multipliers = 18;
  // Since 1.6.0, decision 5 (2026-10-16): whether the day's book may be published, and why not.
  // Only the final book over a cap blocks: gross leverage (L_g), net leverage (L_n), the per-name
  // cap (CAP) or the fund's margin cap (MARGIN); also a desk book whose caps were not measured,
  // or whose overlay refused ("refused"). An approved override is blocked by MARGIN only. Every
  // other check is reported and does not block. A client gates Approve on this, not on
  // within_limits, and does not recompute it.
  bool blocks_publish = 19;
  repeated RiskBreach blockers = 20;
}

message RiskMultiplier {
  // "m", "risk_scale", "idm:<strategy>" or "fdm:<strategy>".
  string name = 1;
  string label = 2;
  // Unset when the day has no reading yet.
  optional double value = 3;
  string detail = 4;
}

enum RiskCheckStatus {
  RISK_CHECK_STATUS_UNSPECIFIED = 0;
  // The reading is at or under its max and nothing cut the book on it.
  RISK_CHECK_STATUS_WITHIN = 1;
  // The limit bound: the engine cut the desk's positions to fit it (a breach).
  RISK_CHECK_STATUS_BOUND = 2;
  // The stored book is over the limit (a breach).
  RISK_CHECK_STATUS_OVER = 3;
  // No reading: a model day, a blind covariance window, a refusal, or an older engine row.
  RISK_CHECK_STATUS_NOT_MEASURED = 4;
}

message RiskCheck {
  // R, R_jump, R_shock, L_g, L_n, CAP, TRIM or refused.
  string term = 1;
  string label = 2;
  // The stored book's reading; unset when not measured.
  optional double value = 3;
  // The limit in force, in the value's unit; unset when none applies.
  optional double max = 4;
  // "percent" (a fraction: 0.31 is 31%), "multiple" (of the sizing capital), "contracts", or
  // "tau" (a multiple of the book's risk target: a max before the engine measured the book).
  string unit = 5;
  RiskCheckStatus status = 6;
  // A sentence for the desk (the symbol of CAP, what bound, why not measured); may be empty.
  string detail = 7;
}
