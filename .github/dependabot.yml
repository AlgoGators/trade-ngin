version: 2
updates:
  # Base image in the Dockerfile (C/C++ library deps are managed via the CI image
  # and install scripts, which Dependabot does not track).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, docker]
    # Stay on Ubuntu LTS: skip the interim releases between 24.04, 26.04 and 28.04.
    ignore:
      - dependency-name: ubuntu
        versions: [">= 24.05, < 26.04", ">= 26.05, < 28.04"]

  # Keep the Actions in the CI/CD pipeline current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
