name: OSSF Scorecard

# Objective, automated supply-chain security score. Published publicly since this
# repo is public (results appear at scorecard.dev and as a repo badge). Gives a
# baseline before the business plan's "annual security audit/pentest from Y1" --
# especially relevant here since this is the repo that places live trades.

on:
  branch_protection_rule:
  schedule:
    - cron: "30 1 * * 6" # weekly, Saturday 01:30 UTC
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
