name: Dependabot auto-merge

# Auto-merges Dependabot PRs that are patch-level version bumps ONCE this repo's
# own CI has passed on them -- minor/major bumps still require manual review.
# Given this repo builds the live-trading image, patch-only is deliberately
# conservative here.
#
# REQUIRES a human to enable "Allow auto-merge" in repo Settings > General first;
# without it, `gh pr merge --auto` will fail on an otherwise-eligible PR.

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge for patch-level updates only
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
