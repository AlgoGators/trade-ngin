name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, main-hd, prod, staging]
  pull_request:
    # A single star does not match feature branch names containing a slash.
    branches:
      - "**"

env:
  COVERAGE_THRESHOLD: 10
jobs:
  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.TRADE_NGIN_CI_IMAGE }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Run Clang Format Check
        run: |
          echo "Checking code formatting..."
          # Check for formatting issues but don't fail the pipeline
          FORMAT_ISSUES=0
          for file in $(find src include -name "*.cpp" -o -name "*.hpp"); do
            if ! clang-format --dry-run --Werror "$file" >/dev/null 2>&1; then
              echo "⚠️  Formatting issues found in: $file"
              FORMAT_ISSUES=$((FORMAT_ISSUES + 1))
            fi
          done

          if [ $FORMAT_ISSUES -eq 0 ]; then
            echo "✅ Code formatting is correct"
          else
            echo "⚠️  Found $FORMAT_ISSUES files with formatting issues (non-blocking)"
            echo "💡 To fix formatting issues, run: clang-format -i src/**/*.cpp include/**/*.hpp"
          fi
      - name: Run Clang Tidy Check
        run: |
          echo "Running clang-tidy static analysis..."
          mkdir -p build
          cd build
          cmake .. -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DNLopt_DIR=/usr/lib/x86_64-linux-gnu/cmake/nlopt

          # Run clang-tidy on all source files and output to report
          find ../src -name "*.cpp" | xargs -P$(nproc) -n1 clang-tidy -p . --format-style=file 2>&1 | tee ../clang-tidy-report.txt || true

          echo "✅ Clang-tidy analysis completed"
          echo "📄 Report saved to clang-tidy-report.txt"

      - name: Run Cppcheck
        run: |
          echo "Running cppcheck static analysis..."
          cppcheck --enable=all --suppress=missingInclude --quiet \
            --error-exitcode=0 --xml --xml-version=2 \
            src include 2> cppcheck-report.xml || true

          # Generate text report
          cppcheck --enable=all --suppress=missingInclude \
            src include 2>&1 | tee cppcheck-report.txt || true

          echo "✅ Cppcheck analysis completed"
      - name: Run Cpplint
        run: |
          echo "Running cpplint..."
          cpplint --recursive --filter=-legal/copyright,-build/include_order src include || true
          echo "✅ Linting completed"

      - name: Create Linting Report
        run: |
          mkdir -p linting
          TIMESTAMP=$(date +%Y-%m-%d_%H-%M-%S)
          REPORT_FILE="linting/lint_report_$TIMESTAMP.txt"
          SUMMARY_FILE="linting/lint_summary_$TIMESTAMP.txt"

          echo "Linting Report - $(date)" > $REPORT_FILE
          echo "=================================" >> $REPORT_FILE

          # Initialize counters
          FORMAT_ISSUES=0
          STYLE_ISSUES=0
          TODO_COUNT=0
          FIXME_COUNT=0
          MEMORY_ISSUES=0
          SERIOUS_ISSUES=0

          echo "🔍 Checking code formatting..." >> $REPORT_FILE
          echo "Clang Format Check:" >> $REPORT_FILE

          # Check formatting issues
          for file in $(find src include -name "*.cpp" -o -name "*.hpp"); do
            if ! clang-format --dry-run "$file" >/dev/null 2>&1; then
              echo "Formatting issues in: $file" >> $REPORT_FILE
              FORMAT_ISSUES=$((FORMAT_ISSUES + 1))
            fi
          done

          if [ $FORMAT_ISSUES -eq 0 ]; then
            echo "✅ No formatting issues found" >> $REPORT_FILE
          else
            echo "⚠️  Found $FORMAT_ISSUES files with formatting issues (COSMETIC)" >> $REPORT_FILE
          fi

          echo "" >> $REPORT_FILE
          echo "Cpplint Results:" >> $REPORT_FILE

          # Add clang-tidy results to report
          echo "" >> $REPORT_FILE
          echo "Clang Tidy Results:" >> $REPORT_FILE
          echo "===================" >> $REPORT_FILE
          if [ -f "clang-tidy-report.txt" ]; then
          cat clang-tidy-report.txt >> $REPORT_FILE
          else
          echo "No clang-tidy report found" >> $REPORT_FILE
          fi

          # Run cpplint and categorize issues
          CPPLINT_OUTPUT=$(cpplint --recursive --filter=-legal/copyright,-build/include_order src include 2>&1 || true)
          echo "$CPPLINT_OUTPUT" >> $REPORT_FILE

          # Count and categorize cpplint issues
          STYLE_ISSUES=$(echo "$CPPLINT_OUTPUT" | grep -c "Total errors found" || echo "0")

          # Check for serious issues
          echo "" >> $REPORT_FILE
          echo "Additional Security/Quality Checks:" >> $REPORT_FILE

          # Check for TODO comments
          TODO_COUNT=$(grep -r "TODO" src include | wc -l || echo "0")
          if [ "$TODO_COUNT" -gt 0 ]; then
            echo "⚠️  Found $TODO_COUNT TODO comments (DEVELOPMENT)" >> $REPORT_FILE
            grep -r "TODO" src include >> $REPORT_FILE || true
          fi

          # Check for FIXME comments
          FIXME_COUNT=$(grep -r "FIXME" src include | wc -l || echo "0")
          if [ "$FIXME_COUNT" -gt 0 ]; then
            echo "⚠️  Found $FIXME_COUNT FIXME comments (KNOWN ISSUES)" >> $REPORT_FILE
            grep -r "FIXME" src include >> $REPORT_FILE || true
          fi

          # Check for potential memory leaks (SERIOUS)
          MEMORY_ISSUES=$(grep -r "new.*delete\|malloc.*free" src include | wc -l || echo "0")
          if [ "$MEMORY_ISSUES" -gt 0 ]; then
            echo "🚨 Found $MEMORY_ISSUES potential memory management issues (SERIOUS)" >> $REPORT_FILE
            grep -r "new.*delete\|malloc.*free" src include >> $REPORT_FILE || true
            SERIOUS_ISSUES=$((SERIOUS_ISSUES + MEMORY_ISSUES))
          fi

          # Check for hardcoded credentials (SERIOUS)
          CREDENTIAL_ISSUES=$(grep -r "password\|secret\|key" src include | wc -l || echo "0")
          if [ "$CREDENTIAL_ISSUES" -gt 0 ]; then
            echo "🚨 Found $CREDENTIAL_ISSUES potential hardcoded credentials (SERIOUS)" >> $REPORT_FILE
            grep -r "password\|secret\|key" src include >> $REPORT_FILE || true
            SERIOUS_ISSUES=$((SERIOUS_ISSUES + CREDENTIAL_ISSUES))
          fi

          # Check for security vulnerabilities (SERIOUS)
          SECURITY_ISSUES=$(find src include -name "*.cpp" -o -name "*.hpp" | xargs grep -l "strcpy\|strcat\|sprintf" | wc -l || echo "0")
          if [ "$SECURITY_ISSUES" -gt 0 ]; then
            echo "🚨 Found $SECURITY_ISSUES potential security vulnerabilities (SERIOUS)" >> $REPORT_FILE
            find src include -name "*.cpp" -o -name "*.hpp" | xargs grep -l "strcpy\|strcat\|sprintf" >> $REPORT_FILE || true
            SERIOUS_ISSUES=$((SERIOUS_ISSUES + SECURITY_ISSUES))
          fi

          # Create summary file
          echo "Linting Summary - $(date)" > $SUMMARY_FILE
          echo "===============================" >> $SUMMARY_FILE
          echo "" >> $SUMMARY_FILE
          echo "📊 Issue Categories:" >> $SUMMARY_FILE
          echo "===================" >> $SUMMARY_FILE
          echo "🎨 COSMETIC (Formatting/Style):" >> $SUMMARY_FILE
          echo "   - Formatting issues: $FORMAT_ISSUES" >> $SUMMARY_FILE
          echo "   - Style guide violations: $STYLE_ISSUES" >> $SUMMARY_FILE
          echo "" >> $SUMMARY_FILE
          echo "🔧 DEVELOPMENT (Work in Progress):" >> $SUMMARY_FILE
          echo "   - TODO comments: $TODO_COUNT" >> $SUMMARY_FILE
          echo "   - FIXME comments: $FIXME_COUNT" >> $SUMMARY_FILE
          echo "" >> $SUMMARY_FILE
          echo "🚨 SERIOUS (Security/Quality):" >> $SUMMARY_FILE
          echo "   - Memory management issues: $MEMORY_ISSUES" >> $SUMMARY_FILE
          echo "   - Hardcoded credentials: $CREDENTIAL_ISSUES" >> $SUMMARY_FILE
          echo "   - Security vulnerabilities: $SECURITY_ISSUES" >> $SUMMARY_FILE
          echo "   - Total serious issues: $SERIOUS_ISSUES" >> $SUMMARY_FILE
          echo "" >> $SUMMARY_FILE
          echo "🔍 Static Analysis (clang-tidy):" >> $SUMMARY_FILE
          if [ -f "clang-tidy-report.txt" ]; then
          CLANG_TIDY_ISSUES=$(grep -c "warning\|error" clang-tidy-report.txt || echo "0")
          echo "   - Static analysis issues: $CLANG_TIDY_ISSUES" >> $SUMMARY_FILE
          else
          echo "   - Static analysis: No report generated" >> $SUMMARY_FILE
          fi

          if [ $SERIOUS_ISSUES -gt 0 ]; then
            echo "❌ ATTENTION: $SERIOUS_ISSUES serious issues found!" >> $SUMMARY_FILE
            echo "   These should be addressed before merging." >> $SUMMARY_FILE
          else
            echo "✅ No serious issues found." >> $SUMMARY_FILE
          fi

          if [ $FORMAT_ISSUES -gt 0 ] || [ $STYLE_ISSUES -gt 0 ]; then
            echo "⚠️  $FORMAT_ISSUES formatting + $STYLE_ISSUES style issues (cosmetic)" >> $SUMMARY_FILE
            echo "   These can be fixed with: clang-format -i src/**/*.cpp include/**/*.hpp" >> $SUMMARY_FILE
          else
            echo "✅ No cosmetic issues found." >> $SUMMARY_FILE
          fi

      - name: Upload Linting Report
        uses: actions/upload-artifact@v4
        with:
          name: linting-report-${{ github.run_number }}
          path: linting/

      - name: Upload Linting Summary
        uses: actions/upload-artifact@v4
        with:
          name: linting-summary-${{ github.run_number }}
          path: linting/lint_summary_*.txt

  build:
    name: Build and Test
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.TRADE_NGIN_CI_IMAGE }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    needs: lint
    strategy:
      matrix:
        build-type: [Debug, Release]
    env:
      BUILD_DIR: ${{ matrix.build-type == 'Release' && 'build/qt-prod' || 'build' }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Configure CMake with Coverage
        shell: bash
        run: |
          TOOLCHAIN_IMAGE='${{ vars.TRADE_NGIN_CI_IMAGE }}'
          if [[ ! "$TOOLCHAIN_IMAGE" =~ @sha256:([0-9a-f]{64})$ ]]; then
            echo "::error::TRADE_NGIN_CI_IMAGE must be pinned by sha256 digest"
            exit 1
          fi
          TOOLCHAIN_DIGEST="sha256:${BASH_REMATCH[1]}"
          cmake -S . -B "$BUILD_DIR" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_CXX_COMPILER=${{ matrix.build-type == 'Debug' && 'g++' || 'g++' }} \
            -DCMAKE_CXX_FLAGS="${{ matrix.build-type == 'Debug' && '-g -O0 --coverage -fprofile-update=atomic' || '-O3' }}" \
            -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.build-type == 'Debug' && '--coverage' || '' }}" \
            -DTRADE_NGIN_TOOLCHAIN_IMAGE_DIGEST="$TOOLCHAIN_DIGEST" \
            -DNLopt_DIR=/usr/lib/x86_64-linux-gnu/cmake/nlopt

      - name: Build Project
        run: |
          cmake --build "$BUILD_DIR" --parallel "$(nproc)"

      - name: Run Valgrind Memory Check
        if: matrix.build-type == 'Debug'
        run: |
          cd "$BUILD_DIR"
          # Run tests with Valgrind
          valgrind --leak-check=full --show-leak-kinds=all --track-origins=yes \
            --error-exitcode=1 ctest --output-on-failure --verbose

      - name: Run Tests
        run: |
          ctest --test-dir "$BUILD_DIR" --output-on-failure --verbose

      - name: Stage exact Release evaluator bundle
        if: matrix.build-type == 'Release'
        run: cmake --build "$BUILD_DIR" --target qt_evaluator_bundle live_config_validator_bundle --parallel 2

      - name: Verify Release artifact contracts
        if: matrix.build-type == 'Release'
        shell: bash
        run: |
          export TRADE_NGIN_TEST_BUILD_DIR="$GITHUB_WORKSPACE/$BUILD_DIR"
          export TRADE_NGIN_TEST_ARTIFACT_DIR="$GITHUB_WORKSPACE/$BUILD_DIR/bin/Release"
          export PYTHONPATH="$GITHUB_WORKSPACE"
          cd tests/contracts
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest -v \
            test_qt_evaluator_bundle.py test_qt_built_bundle.py \
            test_qt_evaluator_bundle_inventory.py test_release_artifacts.py \
            test_release_identity.py test_release_pipeline.py \
            test_qt_test_artifact_paths.py

      - name: Package canonical Release tree
        if: matrix.build-type == 'Release'
        shell: bash
        run: |
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          (
            cd "$BUILD_DIR"
            find bin/Release qt-evaluator-bundle live-config-validator-bundle -type f -print0 \
              | sort -z | xargs -0 sha256sum > release-files.sha256
          )
          tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner \
            -cf trade-ngin-release.tar \
            "$BUILD_DIR/bin/Release" \
            "$BUILD_DIR/qt-evaluator-bundle" \
            "$BUILD_DIR/live-config-validator-bundle" \
            "$BUILD_DIR/include/trade_ngin/git_version.hpp" \
            "$BUILD_DIR/release-files.sha256"

      - name: Upload canonical Release tree
        if: matrix.build-type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: canonical-release-${{ github.sha }}
          path: trade-ngin-release.tar
          if-no-files-found: error
          retention-days: 30

      - name: Generate Coverage Report
        if: matrix.build-type == 'Debug'
        run: |
          cd "$BUILD_DIR"
          # Generate coverage data
          lcov --capture --directory . --output-file coverage.info --ignore-errors mismatch --ignore-errors negative

          # Keep coverage scope aligned with Sonar sources (src + include)
          lcov --extract coverage.info '*/src/*' '*/include/*' --output-file coverage.info --ignore-errors unused

          # Generate HTML report
          genhtml coverage.info --output-directory coverage_html

          # Generate SonarQube-format XML coverage report (consumed by SonarCloud)
          gcovr --root .. --filter '../src/.*' --filter '../include/.*' --sonarqube --output coverage-sonarqube.xml

          # Generate XML report for GitHub
          gcovr --root .. --filter '../src/.*' --filter '../include/.*' --xml --output coverage.xml

          # Generate a text summary for easier CI diagnostics
          gcovr --root .. --filter '../src/.*' --filter '../include/.*' --txt --output coverage.txt

      - name: Validate Coverage Artifacts
        if: matrix.build-type == 'Debug'
        run: |
          cd "$BUILD_DIR"
          test -s coverage-sonarqube.xml || { echo "Missing build/coverage-sonarqube.xml"; exit 1; }
          test -s coverage.xml || { echo "Missing build/coverage.xml"; exit 1; }

      - name: Coverage Debug Summary
        if: matrix.build-type == 'Debug'
        run: |
          cd "$BUILD_DIR"
          echo "Files included in Sonar coverage report:"
          grep -o 'path="[^"]*"' coverage-sonarqube.xml | sed 's/path="//;s/"$//' | sort -u | head -n 200
          echo ""
          echo "Lowest coverage files from lcov:"
          lcov --list coverage.info | tail -n +1
          echo ""
          echo "gcovr text summary:"
          cat coverage.txt

      - name: Check Coverage Threshold
        if: matrix.build-type == 'Debug'
        run: |
          cd "$BUILD_DIR"
          # Extract coverage percentage (get the number before the %)
          COVERAGE_PERCENT=$(lcov --summary coverage.info 2>&1 | grep "lines" | grep -oP '\d+\.\d+(?=%)')
          echo "Coverage: $COVERAGE_PERCENT%"

          # Check if coverage meets threshold using awk instead of bc
          if [ $(awk -v cov="$COVERAGE_PERCENT" -v thresh="${{ env.COVERAGE_THRESHOLD }}" 'BEGIN {print (cov < thresh)}') -eq 1 ]; then
            echo "❌ Coverage ($COVERAGE_PERCENT%) is below threshold (${{ env.COVERAGE_THRESHOLD }}%)"
            exit 1
          else
            echo "✅ Coverage ($COVERAGE_PERCENT%) meets threshold (${{ env.COVERAGE_THRESHOLD }}%)"
          fi
      - name: SonarCloud Scan
        if: matrix.build-type == 'Debug' && env.SONAR_TOKEN != '' && (github.event_name == 'pull_request' || github.ref_name == 'main' || github.ref_name == 'prod' || github.ref_name == 'staging')
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload Coverage Reports
        if: matrix.build-type == 'Debug'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-${{ github.run_number }}
          path: |
            build/coverage_html/
            build/coverage.xml
            build/coverage-sonarqube.xml
            build/coverage.txt
            build/coverage.info
            build/compile_commands.json

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}-${{ matrix.build-type }}
          path: ${{ env.BUILD_DIR }}/Testing/

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Run Security Scan
        run: |
          echo "Running basic security checks..."
          # Check for common security issues in C++ code
          find src include -name "*.cpp" -o -name "*.hpp" | xargs grep -l "strcpy\|strcat\|sprintf" || echo "No obvious security issues found"

          # Check for hardcoded credentials
          grep -r "password\|secret\|key" src include || echo "No obvious hardcoded credentials found"
  report:
    name: Generate Summary Report
    runs-on: ubuntu-latest
    needs: [lint, build, security-scan]
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Download Coverage Reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-reports-${{ github.run_number }}
          path: coverage-reports/

      - name: Download Linting Reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: linting-report-${{ github.run_number }}
          path: linting-reports/

      - name: Generate Summary
        run: |
          echo "# CI/CD Pipeline Summary" > summary.md
          echo "## Build Status" >> summary.md
          echo "- Linting: ${{ needs.lint.result }}" >> summary.md
          echo "- Build: ${{ needs.build.result }}" >> summary.md
          echo "- Security: ${{ needs.security-scan.result }}" >> summary.md

          if [ -f "coverage-reports/build/coverage.xml" ]; then
            echo "## Coverage Report" >> summary.md
            echo "Coverage report is available in the artifacts." >> summary.md
          fi

          if [ -d "linting-reports/" ]; then
            echo "## Linting Report" >> summary.md
            echo "Linting report is available in the artifacts." >> summary.md
          fi

      - name: Upload Summary Report
        uses: actions/upload-artifact@v4
        with:
          name: summary-report-${{ github.run_number }}
          path: summary.md
  image-generation:
    name: Image Generation
    if: github.event_name == 'pull_request' || github.ref_name == 'prod' || github.ref_name == 'staging'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.TRADE_NGIN_CI_IMAGE }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    needs: [lint, build, security-scan]
    outputs:
      repo: ${{ steps.build.outputs.repo }}
      tag: ${{ steps.build.outputs.tag }}
      sha_tag: ${{ steps.build.outputs.sha_tag }}
      short_sha: ${{ steps.build.outputs.short_sha }}
      full_sha: ${{ steps.build.outputs.full_sha }}
      image_digest: ${{ steps.build.outputs.image_digest }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Download canonical tested Release tree
        uses: actions/download-artifact@v4
        with:
          name: canonical-release-${{ github.sha }}
          path: build/qt-download
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Image
        id: build
        shell: bash
        run: |
          set -euo pipefail
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-${GITHUB_REF#refs/heads/}}}"
          BRANCH=${BRANCH:-unknown}
          BRANCH_SAFE=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | tr '/@: ' '-')
          TAG="${BRANCH_SAFE}-$(date +%Y%m%d)-$(date +%H%M%S)"

          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          FULL_SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          test "$FULL_SHA" = "$GITHUB_SHA"

          ARCHIVE=build/qt-download/trade-ngin-release.tar
          test -s "$ARCHIVE"
          tar -tf "$ARCHIVE" | awk 'index($0,"build/qt-prod/") == 1 {next} {exit 1}'
          tar -xf "$ARCHIVE"
          grep -Fxq "#define TRADE_NGIN_GIT_SHA \"${SHORT_SHA}\"" \
            build/qt-prod/include/trade_ngin/git_version.hpp
          grep -Fxq "#define TRADE_NGIN_GIT_SHA_FULL \"${FULL_SHA}\"" \
            build/qt-prod/include/trade_ngin/git_version.hpp
          (cd build/qt-prod && sha256sum -c release-files.sha256)

          RUNTIME_BASE_IMAGE='${{ vars.TRADE_NGIN_RUNTIME_BASE_IMAGE }}'
          if [[ ! "$RUNTIME_BASE_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::TRADE_NGIN_RUNTIME_BASE_IMAGE must be pinned by sha256 digest"
            exit 1
          fi
          TOOLCHAIN_IMAGE='${{ vars.TRADE_NGIN_CI_IMAGE }}'
          if [[ ! "$TOOLCHAIN_IMAGE" =~ @sha256:([0-9a-f]{64})$ ]]; then
            echo "::error::TRADE_NGIN_CI_IMAGE must be pinned by sha256 digest"
            exit 1
          fi
          TOOLCHAIN_DIGEST="sha256:${BASH_REMATCH[1]}"
          APACHE_ARROW_APT_SOURCE_SHA256='${{ vars.APACHE_ARROW_APT_SOURCE_SHA256 }}'
          if [[ ! "$APACHE_ARROW_APT_SOURCE_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::APACHE_ARROW_APT_SOURCE_SHA256 must be a 64-hex reviewed digest"
            exit 1
          fi
          TRADE_NGIN_BOOTSTRAP_APT_PACKAGES='${{ vars.TRADE_NGIN_BOOTSTRAP_APT_PACKAGES }}'
          TRADE_NGIN_RUNTIME_APT_PACKAGES='${{ vars.TRADE_NGIN_RUNTIME_APT_PACKAGES }}'
          test -n "$TRADE_NGIN_BOOTSTRAP_APT_PACKAGES"
          test -n "$TRADE_NGIN_RUNTIME_APT_PACKAGES"
          for package in $TRADE_NGIN_BOOTSTRAP_APT_PACKAGES $TRADE_NGIN_RUNTIME_APT_PACKAGES; do
            [[ "$package" == *=?* ]] || { echo "::error::Package lacks exact version: $package"; exit 1; }
          done

          docker build \
            --build-arg RUNTIME_BASE_IMAGE="$RUNTIME_BASE_IMAGE" \
            --build-arg TRADE_NGIN_GIT_SHA="$SHORT_SHA" \
            --build-arg TRADE_NGIN_GIT_SHA_FULL="$FULL_SHA" \
            --build-arg APACHE_ARROW_APT_SOURCE_SHA256="$APACHE_ARROW_APT_SOURCE_SHA256" \
            --build-arg TRADE_NGIN_BOOTSTRAP_APT_PACKAGES="$TRADE_NGIN_BOOTSTRAP_APT_PACKAGES" \
            --build-arg TRADE_NGIN_RUNTIME_APT_PACKAGES="$TRADE_NGIN_RUNTIME_APT_PACKAGES" \
            -t "${REPO}:${TAG}" .
          docker push "${REPO}:${TAG}"

          SHA_TAG="$SHORT_SHA"
          docker tag "${REPO}:${TAG}" "${REPO}:${SHA_TAG}"
          docker push "${REPO}:${SHA_TAG}"
          resolve_digest() {
            docker buildx imagetools inspect "$1" --format '{{.Manifest.Digest}}'
          }
          IMAGE_DIGEST=$(resolve_digest "${REPO}:${TAG}")
          test "$IMAGE_DIGEST" = "$(resolve_digest "${REPO}:${SHA_TAG}")"

          # Hash the downloaded, tested tree directly. No configure or build is
          # allowed in this job: the runtime image and manifest bind the exact
          # bytes produced and tested by the Release matrix job.
          PYTHONDONTWRITEBYTECODE=1 python3 -B apps/tools/release_artifacts.py \
            --create --release-root build/qt-prod \
            --git-sha-full "$FULL_SHA" --git-sha-short "$SHORT_SHA" \
            --toolchain-image-digest "$TOOLCHAIN_DIGEST" \
            --image-digest "$IMAGE_DIGEST" \
            --manifest build/qt-prod/release-artifacts.json \
            --schema apps/tools/release_artifacts_schema.json \
            --bundle-directory build/qt-prod/qt-evaluator-bundle \
            --require-worker
          PYTHONDONTWRITEBYTECODE=1 python3 -B apps/tools/release_artifacts.py \
            --verify --manifest build/qt-prod/release-artifacts.json \
            --installed-root build/qt-prod \
            --bundle-directory build/qt-prod/qt-evaluator-bundle

          # Detached attestations bind the already pushed image, avoiding a digest cycle.
          PYTHONDONTWRITEBYTECODE=1 python3 -B apps/tools/live_config_release.py --create \
            --manifest build/qt-prod/live-config-release.json \
            --core-manifest build/qt-prod/release-artifacts.json \
            --installed-root build/qt-prod --qt-bundle build/qt-prod/qt-evaluator-bundle \
            --validator-bundle build/qt-prod/live-config-validator-bundle
          PYTHONDONTWRITEBYTECODE=1 python3 -B apps/tools/live_config_release.py \
            --manifest build/qt-prod/live-config-release.json \
            --core-manifest build/qt-prod/release-artifacts.json \
            --installed-root build/qt-prod --qt-bundle build/qt-prod/qt-evaluator-bundle \
            --validator-bundle build/qt-prod/live-config-validator-bundle

          echo "repo=${REPO}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "full_sha=${FULL_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_digest=${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Upload immutable Release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.sha }}
          path: |
            build/qt-prod/release-artifacts.json
            build/qt-prod/live-config-release.json
            build/qt-prod/live-config-validator-bundle/
            build/qt-prod/qt-evaluator-bundle/
            build/qt-prod/release-files.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Install Trivy
        shell: bash
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/v0.74.0/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan image with Trivy
        shell: bash
        run: |
          trivy image --format sarif --output trivy-results.sarif \
            --severity CRITICAL,HIGH --exit-code 1 \
            "${{ steps.build.outputs.repo }}@${{ steps.build.outputs.image_digest }}"

      - name: Promote scanned prod digest to latest
        if: github.event_name == 'push' && github.ref_name == 'prod'
        shell: bash
        run: |
          set -euo pipefail
          REPO='${{ steps.build.outputs.repo }}'
          DIGEST='${{ steps.build.outputs.image_digest }}'
          docker buildx imagetools create --tag "${REPO}:latest" "${REPO}@${DIGEST}"
          LATEST=$(docker buildx imagetools inspect "${REPO}:latest" --format '{{.Manifest.Digest}}')
          test "$LATEST" = "$DIGEST"

      - name: Upload Trivy results to Security tab
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3.37.8
        with:
          sarif_file: trivy-results.sarif

  schema-ownership-guard:
    name: Schema Ownership Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Fail if a forbidden schema is referenced
        shell: bash
        # ADR-000 C-3 (cross-repo-contracts.md) assigns futures_data/equities_data/
        # options_data/synthetic to data-ngin, auth to AlgoLens, and research to
        # algosystem -- trade-ngin must never write into them. This scans the two
        # locations that build schema-qualified SQL identifiers (the DB-access
        # layer and the results-storage layer, both confirmed by grep to be where
        # every "schema.table"-shaped literal in this repo lives) for those
        # forbidden prefixes. It is a permanent regression guard for the exact
        # backtest.equity_curve/research schema-collision class of bug ADR-000 §6
        # flagged between trade-ngin and algosystem.
        run: |
          FORBIDDEN='"(futures_data|equities_data|options_data|synthetic|auth|research)\.'
          if grep -rnE "$FORBIDDEN" src/data src/storage --include="*.cpp" --include="*.hpp"; then
            echo "::error::Found a reference to a schema trade-ngin does not own (see ADR-000 C-3). If this is intentional, update the allow-list in this workflow and confirm with whoever owns that schema."
            exit 1
          fi
          echo "OK: no forbidden-schema references found in src/data or src/storage."

  deploy-to-ec2:
    name: 'Deploy to EC2'
    if: github.ref_name == 'prod' && github.event_name == 'push'
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.TRADE_NGIN_CI_IMAGE }}
    needs: image-generation
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu
            REPO='${{ needs.image-generation.outputs.repo }}'
            EXPECTED_DIGEST='${{ needs.image-generation.outputs.image_digest }}'
            EXPECTED_SHORT_SHA='${{ needs.image-generation.outputs.short_sha }}'
            EXPECTED_FULL_SHA='${{ needs.image-generation.outputs.full_sha }}'
            case "$EXPECTED_DIGEST" in sha256:????????????????????????????????????????????????????????????????) ;; *) exit 1 ;; esac
            docker pull "${REPO}@${EXPECTED_DIGEST}"
            EXPECTED_IMAGE_ID=$(docker image inspect "${REPO}@${EXPECTED_DIGEST}" --format '{{.Id}}')
            docker pull "${REPO}:latest"
            LATEST_IMAGE_ID=$(docker image inspect "${REPO}:latest" --format '{{.Id}}')
            test "$EXPECTED_IMAGE_ID" = "$LATEST_IMAGE_ID"
            docker stop trade-ngin || true
            docker rm trade-ngin || true
            cd /home/ubuntu/docker-compose/trade-ngin
            docker compose up -d
            RUNNING_IMAGE_ID=$(docker inspect trade-ngin --format '{{.Image}}')
            RUNNING_FULL_SHA=$(docker inspect trade-ngin --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
            RUNNING_SHORT_SHA=$(docker inspect trade-ngin --format '{{index .Config.Labels "org.algogators.trade-ngin.short-sha"}}')
            test "$RUNNING_IMAGE_ID" = "$EXPECTED_IMAGE_ID"
            test "$RUNNING_FULL_SHA" = "$EXPECTED_FULL_SHA"
            test "$RUNNING_SHORT_SHA" = "$EXPECTED_SHORT_SHA"
            docker exec trade-ngin sh -lc 'cd /app/build && sha256sum -c release-files.sha256'
